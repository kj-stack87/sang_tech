name: Send daily email reports

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  send-daily-email:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily email task
        env:
          SANTECH_APP_URL: ${{ secrets.SANTECH_APP_URL }}
          SANTECH_CRON_SECRET: ${{ secrets.SANTECH_CRON_SECRET }}
        run: |
          if [ -z "$SANTECH_APP_URL" ] || [ -z "$SANTECH_CRON_SECRET" ]; then
            echo "SANTECH_APP_URL or SANTECH_CRON_SECRET is not set; skipping."
            exit 0
          fi
          APP_URL="${SANTECH_APP_URL%/}"
          curl -fsS --retry 3 --retry-delay 20 --max-time 180 -X POST "$APP_URL/api/tasks/daily-email" \
            -H "X-Cron-Secret: $SANTECH_CRON_SECRET"
