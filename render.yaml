services:
  - type: web
    name: santech-manager
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SANTECH_DEFAULT_USERNAME
        value: sago87
      - key: SANTECH_DEFAULT_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SANTECH_CRON_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_FORCE_IPV4
        value: "true"
